name: Release

# Builds the Windows installer and the Linux packages (AppImage, .deb, .rpm).
# A pushed v* tag uploads them to a draft GitHub release (published by hand);
# a manual run only keeps them as build artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          # The oldest supported Ubuntu keeps the AppImage compatible with more distributions.
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Bundled ffmpeg
        run: npm run fetch-ffmpeg -- ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Without a tag (manual run) nothing is uploaded to a release.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Atak Viewer ${{ github.ref_name }}
          releaseDraft: true
          assetNamePattern: "atak-viewer_[version]_[platform]_[arch][setup][ext]"

      - uses: actions/upload-artifact@v4
        with:
          name: atak-viewer-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
